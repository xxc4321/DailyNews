    name: Jiangnanbuyi Investor Relations
    channel: news
    adapter: page_links
    tier: S0
    url: https://www.jiangnanbuyigroup.com.cn/group/s/investor
    languages: [zh, en]
    approved: true
    require_date: true
  - id: google-news-rss
    name: Google News RSS Discovery
    channel: discovery
    adapter: google_news_rss
    tier: S2
    languages: [zh, en, fr, it]
    approved: true
  - id: gdelt-doc
    name: GDELT DOC Discovery
    channel: discovery
    adapter: gdelt
    tier: S2
    languages: [zh, en, fr, it]
    approved: true
  - id: authorized-review-json
    name: Authorized Review JSON Import
    channel: review
    adapter: json_review
    tier: V
    approved: false
  - id: bluesky-public
    name: Bluesky Public Search
    channel: review
    adapter: bluesky_public
    tier: V
    approved: true
    queries: [JNBY, 江南布衣, CROQUIS fashion, LESS fashion]
