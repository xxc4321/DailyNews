  - id: supply-chain-dive-news
    name: Supply Chain Dive News
    channel: news
    adapter: rss
    tier: S1
    url: https://www.supplychaindive.com/feeds/news/
    languages: [en]
    approved: true
  - id: modern-retail-feed
    name: Modern Retail
    channel: news
    adapter: rss
    tier: S1
    url: https://www.modernretail.co/feed/
    languages: [en]
    approved: true
  - id: wwd-feed
    name: WWD
    channel: news
    adapter: rss
    tier: S1
    url: https://wwd.com/feed/
    languages: [en]
    approved: true
  - id: jiangnanbuyi-news
    name: Jiangnanbuyi Official News
    channel: news
